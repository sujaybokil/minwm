# minwm configuration. Restart minwm after changing this file.
# Hotkeys use AutoHotkey v2 notation: # = Win, + = Shift.

# Windows smaller than either dimension are ignored by tiling.
minWidth = 320
minHeight = 220

# The manager checks for window changes at this interval, in milliseconds.
pollInterval = 400

defaultGap = 12
gapStep = 4
minGap = 0

# The first tiled window is the master. The remaining windows form the stack.
masterRatio = 0.58
masterRatioStep = 0.04
minMasterRatio = 0.30
maxMasterRatio = 0.75

debugLogPath = "minwm-debug.log"
# Rotate the log to minwm-debug.log.1 after it reaches this size.
debugMaxSizeMb = 5

# Classes that must never be tiled. Use one line; only quoted strings are supported.
excludedClasses = ["Progman", "WorkerW", "Shell_TrayWnd", "#32770"]

[hotkeys]
cycleLayout = "#t"
retile = "#r"
increaseGap = "#]"
decreaseGap = "#["
increaseMaster = "#+]"
decreaseMaster = "#+["
focusNext = "#j"
focusPrevious = "#k"
moveNext = "#+j"
movePrevious = "#+k"
swapMaster = "#Enter"
closeWindow = "#w"
showHotkeys = "#i"
