name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: pwsh
        run: |
          $version = (Get-Content -Raw AUTOHOTKEY_VERSION).Trim()
          choco install autohotkey --version $version --no-progress --yes
          choco install innosetup --no-progress --yes

      - name: Build tested installer
        shell: pwsh
        run: .\tools\installer.ps1

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag dist\minwm-setup.exe --title "minwm $tag" --generate-notes
