name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: pwsh
        run: |
          $version = (Get-Content -Raw AUTOHOTKEY_VERSION).Trim()
          choco install autohotkey --version $version --no-progress --yes
          choco install innosetup --no-progress --yes

      - name: Validate and test
        shell: pwsh
        run: .\tools\Test.ps1

      - name: Build installer
        shell: pwsh
        run: .\tools\Build-Installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: minwm-installer
          path: dist/minwm-setup.exe
          if-no-files-found: error
